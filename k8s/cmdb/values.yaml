# Default Configuration
namespace: default

api:
  image: idc-test-harbor.neuedu.com/cmdb/cmdb-api
  replicaCount: 1
  service:
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  env: {}

ui:
  image: idc-test-harbor.neuedu.com/cmdb/cmdb-ui
  replicaCount: 1
  service:
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: false
  className: nginx
  host: ""
  apiPath: /api
  uiPath: /
  annotations: {}